{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block content %}
    <!-- Start All Title Box -->
    <div class="all-title-box">
        <div class="container">
            <div class="row">
                <div class="col-lg-12">
                    <h2>SEARCH</h2>
                    <ul class="breadcrumb">
                        <li class="breadcrumb-item"><a href="#">Home</a></li>
                        <li class="breadcrumb-item active">SEARCH</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
    <!-- End All Title Box -->

<div class="container w-50 p-5 mt-5 text-center border border-3 shadow">

    {% if products %}
         <div class="row special-list">
             {% for i in products %}
                        <div class="col-lg-3 col-md-6 special-grid best-seller">
                            <div class="products-single fix">
                                <div class="box-img-hover">
                                    <div class="type-lb">
                                        <p class="sale">Sale</p>
                                    </div>
                                    <img src="{{i.image.url}}" class="" height="250px" width="100%" alt="Image">
                                    <div class="mask-icon">
                                        <ul>
                                            <li><a href="#" data-toggle="tooltip" data-placement="right" title="View"><i class="fas fa-eye"></i></a></li>
                                            <li><a href="#" data-toggle="tooltip" data-placement="right" title="Compare"><i class="fas fa-sync-alt"></i></a></li>
                                            <li><a href="#" data-toggle="tooltip" data-placement="right" title="Add to Wishlist"><i class="far fa-heart"></i></a></li>
                                        </ul>
                                        <a class="cart" href="{% url 'shop:details' i.id %}">Details</a>
                                    </div>
                                </div>
                                <div class="why-text">
                                    <h4>{{i.name}}</h4>

                                </div>
                            </div>
                        </div>
              {% endfor %}
         </div>
    {% else %}
         <h2 class="text-center" style="color:#b0b435 !important;">No Search Results Found</h2>
    {% endif %}
</div>


<br>
{% endblock %}
