{% extends 'base.html' %}
{% block content %}
    <!-- Start All Title Box -->
    <div class="all-title-box">
        <div class="container">
            <div class="row">
                <div class="col-lg-12">
                    <h2>PAYMENT</h2>
                    <ul class="breadcrumb">
                        <li class="breadcrumb-item"><a href="#">Home</a></li>
                        <li class="breadcrumb-item active">CHECKOUT</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
    <!-- End All Title Box -->
<div class="container w-50 p-5 mt-5 text-center border border-3 shadow">
{% if payment %}
    <form action="{% url 'cart:success' user.username %}" method="POST">
    <script
       src="https://checkout.razorpay.com/v1/checkout.js"
        data-key="rzp_test_S60Hda5e7FXT1U"
        data-amount={{payment.amount}}
        data-currency="INR"
        data-order_id={{payment.id}}
        data-buttontext="Pay Now"
        data-name="FreshShop"
        data-description="Secure payment for your FreshShop order"
        data-image="https://example.com/your_logo.jpg"
        data-prefill.name={{user.username}}
        data-prefill.email="akash.ks@example.com"
        data-theme.color="#b0b435"
    ></script>
    <input type="hidden" custom="Hidden Element" name="hidden"/>
    </form>
{% else %}
      <h2 class="text-center text-success mb-2" style="color:#b0b435 !important;">Your Order Placed Successfully</h2>
      <a href="{% url 'shop:categories' %}">Continue Shopping</a>
{% endif %}

    </div>

<br>
{% endblock %}
